spring:
  application:
    name: order-management-system


#  datasource:
#    url: jdbc:postgresql://localhost:5432/oms
#    username: postgres
#    password: 161199

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

springdoc:
  override-with-generic-response: false

server:
  port: 8080

outbox:
  poll:
    delay: 60000

management:
  endpoints:
    web:
      exposure:
        include: health,info



